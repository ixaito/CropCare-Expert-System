{% extends "base.html" %}
{% block content %}
<div class="auth-card">
  <h1>Reset password</h1>
  <p class="muted">Enter your email. A reset link will be sent if the account exists.</p>
  {% if success %}<div class="alert success">{{ success }}</div>{% endif %}
  <form method="post" action="/forgot-password" class="form">
    <label>Email
      <input type="email" name="email" required autocomplete="email">
    </label>
    <button type="submit" class="button full">Send reset link</button>
  </form>
  <p class="muted center"><a href="/login">Back to login</a></p>
</div>
{% endblock %}
