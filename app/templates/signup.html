{% extends "base.html" %}
{% block content %}
<div class="auth-card">
  <h1>Create account</h1>
  <p class="muted">Create a secure account to save and review your diagnostic queries.</p>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" action="/signup" class="form">
    <label>Full name
      <input type="text" name="full_name" required autocomplete="name">
    </label>
    <label>Email
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label>Password
      <input type="password" name="password" required minlength="8" autocomplete="new-password">
    </label>
    <button type="submit" class="button full">Sign up</button>
  </form>
  <p class="muted center">Already have an account? <a href="/login">Login</a></p>
</div>
{% endblock %}
